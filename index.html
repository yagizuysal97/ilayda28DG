<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bir Davetin Var 💌 — İlayda 28</title>
<meta name="description" content="İlayda'nın 28. yaş gününe davetlisin." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<main class="invite-stage">
  <div class="fireflies"></div>

  <svg class="grove-line" viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="#1C1629" d="M0,220 L0,140 C60,90 90,150 150,110 C190,85 210,140 260,120 C320,95 340,160 400,130 C460,100 480,150 540,125 C600,100 620,160 680,135 C740,110 760,150 820,120 C880,95 900,155 960,130 C1020,105 1040,150 1100,125 C1160,100 1180,150 1240,130 C1300,110 1340,150 1440,120 L1440,220 Z"/>
  </svg>

  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" tabindex="0" role="button" aria-label="Davetiyeyi aç" id="envelope">
      <div class="envelope-body"></div>

      <div class="invite-card">
        <p class="invite-eyebrow">Bir Davetin Var</p>
        <h1 class="invite-name">İlayda&nbsp;28</h1>
        <p class="invite-details">26 Ağustos, bu akşam</p>
        <p class="invite-details">Koç Topluluğu Spor Korusu</p>
        <p class="invite-details">19:30 – 20:00</p>
      </div>

      <div class="envelope-flap"></div>
      <div class="seal">İ</div>
    </div>

    <p class="envelope-hint">Açmak için zarfa dokun</p>

    <div class="continue-btn-wrap">
      <button class="btn btn-primary" id="continueBtn">Devam Et →</button>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
