<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anı Defteri — Yönetim</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <form class="lock-card" id="lockForm">
    <p class="hero-eyebrow" style="color:var(--gold)">Yalnızca Senin İçin</p>
    <h1 class="section-title" style="color:var(--cream)">Anı defterini görüntüle</h1>
    <input type="password" id="lockInput" placeholder="Şifre" autofocus>
    <button type="submit" class="btn btn-primary">Gir</button>
    <p id="lockError" style="color:var(--ember); margin-top:12px; font-size:0.85rem;"></p>
  </form>
</div>

<div class="admin-shell" id="adminShell" style="display:none;">
  <div class="admin-header">
    <div class="logo" style="color:var(--cream)">Anı Defteri</div>
    <a href="home.html" class="btn btn-ghost" style="color:var(--cream); border-color:rgba(247,239,228,0.4);">← Ana Sayfaya Dön</a>
  </div>

  <p class="admin-loading" id="adminLoading">Mesajlar yükleniyor…</p>
  <p class="admin-empty" id="adminEmpty" style="display:none;">Henüz hiç mesaj yok.</p>

  <div class="admin-table-wrap" style="display:none;">
    <table class="admin-table">
      <thead>
        <tr><th>Tarih</th><th>İsim</th><th>Mesaj</th></tr>
      </thead>
      <tbody id="entriesBody"></tbody>
    </table>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
